<section class="theater">
  <img class="theaters" src="/Theater.jpg" alt="Fight Background">
  <div>
    <button class="home-button" (click)="HomePage()">Home</button>
  </div>
  <div class="position-player div_widthmax12">
    <img [src]="Playerscharacters.fight_sprite" alt="Player character" class="retourne image_size">
    <div class=" barre_de_vie_player ">
      <div class ="barre_actuel"  [style.--health]="(Playerscharacters.hp*100)/playermaxhealth"></div>
    </div>
  </div>
  <div class="position-bot div_widthmax12">
    <img [src]="Botcharacters.fight_sprite" alt="Bot character" class="image_size">
    <div class="barre_de_vie_bot">
      <div class="barre_actuel"  [style.--health]="(Botcharacters.hp*100)/botmaxhealth" ></div>
    </div>
  </div>
  <div>
    <div class="Fp_card">
      <div class="FP_Title">
        <h1>FP : {{cout}}</h1>
      </div>
    </div>
    <div>
      <h1 class="title-attack">Attacks:</h1>
    </div>
    <div class="card-attack ">
      <div class="line_scroll">
        @for (attack of attacks;track attack){
          <button class="attacks-card"  (click)="Attaquer(attack)" [disabled]="finish">{{attack.name}}<p class="FP_cost">FP :{{attack.fp_cost}}</p></button>

        }
      </div>
    </div>
    <div class="card-logs">
      <div class="line_scroll">
        @for(log of logs;track log){
          <p>{{ log }}</p>
        }
      </div>
    </div>
    <div class="card-item">
      <div class="line_scroll_item">
        @for (item of items; track item){
          <button class="item activate" (click)="Active_item(item.slug)">{{item.name}}</button>
        }
      </div>
    </div>

  </div>
  <div>
    @if (finish== true){
      <p class="Finish_card">{{Wins}}</p>
    }
  </div>
</section>
