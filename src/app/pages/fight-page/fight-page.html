<section class="theater">
  <img class="theaters" src="/Theater.jpg" alt="Fight Background">
  <div class="position-player">
    <img [src]="Playerscharacters.fight_sprite" alt="Player character" class="retourne">
  </div>
  <div class="position-bot">
    <img [src]="Botcharacters.fight_sprite" alt="Bot character" class="">
    <p>{{Botcharacters.hp}}</p>
  </div>
  <div>
    <button (click)="Attaquer()">{{attacks[1].name}}</button>
  </div>
</section>
