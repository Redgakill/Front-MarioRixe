<div class="Background viewport">
  <div>
    <div class="padding-5">
      <button (click)="HomePage()">Home</button>
    </div>
    <h1 class="title">Mariodex</h1>
  </div>
  <div class="margin-5 ">
    <label for="tri">Trier</label>
    <select (change)="Trieby($any($event.target).value)">
      <option value="name">Nom</option>
      <option value="hp">Point de vie</option>
      <option value="attack">Attaque</option>
    </select>
    <div class="Line"></div>
  </div>
  <div class="grille">
    @for(character of characters ; track character){
      <div >
        <img src="{{character.sprite}}">
        <p>{{character.name}}</p>
      </div>
    }
  </div>
</div>
