<div class="Background viewport ">
  <div class="wallpaper">
    <img src="/Mariofond.jpg" alt="MarioFond">
  </div>
  <div>
    <div class="padding-5">
      <button (click)="HomePage()">Home</button>
    </div>
    <h1 class="title">Mariodex</h1>
  </div>
  <div class="margin-5 ">

    <select (change)="Trieby($any($event.target).value)">
      <option value="name">Nom</option>
      <option value="hp">Point de vie</option>
      <option value="attack">Attaque</option>
      <option value="defense">Defense</option>
    </select>
    <div class="Line"></div>
  </div>
  <div class="grille padding-5 ">
    @for(character of characters ; track character){
      <div class=" padding-3">
        <img src="{{character.inv_sprite}}" (click)="CharacterPage(character._id)">
        <h1 class="name_character">{{character.name}}</h1>
      </div>
    }
  </div>
</div>
